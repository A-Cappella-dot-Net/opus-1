# Global config.properties used by all Presto/Madrigal processes
#
pin.to.cpu=0
pin.tlt.to.cpu=0
#
# TightLoopThread
client.micro.threshold=10000
client.idle.strategy=backoff
#
# FtMonitor
mon.conf.interval=10
mem.conf.interval=0
#
# AeronClient, AeronDaemon, ExchangeServer, LineHandler
connection.timeout.millis=200
reconnect.interval.millis=200
#
# AeronClient
pub.stream=10
sub.stream=10
snap.timeout.from.init=2000
snap.timeout.from.latest=2000
# channel.type=ipc
channel.type=multicast
unicast.channel=aeron:udp?endpoint=localhost:40123
multicast.channel=aeron:udp?endpoint=224.0.1.1:40123
#multicast.channel=aeron:udp?endpoint=224.0.1.1:40123|interface=10.10.10.0/24
#
# PublicationHelper
retries.on.back.pressure=0
sleep.nanos.on.back.pressure.retry=1000000
#
# AeronSerializer
tracker.list.size=100
tracker.cell.buffer.size=1024
#
# AeronDaemon
use.votedquorum=false
#